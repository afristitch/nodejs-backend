{{> header}}

<h2 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 700; color: #122E22;">
  {{{subject}}}
</h2>

<p style="margin: 0 0 14px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  Hi <strong>{{{name}}}</strong>,
</p>

<div style="background-color: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px 20px; margin: 16px 0 20px 0; color: #374151; font-size: 15px; line-height: 1.7;">
  {{{bodyHtml}}}
</div>

{{> footer}}
