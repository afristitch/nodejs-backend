{{> header}}

<h2 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 700; color: #122E22;">
  Your SewDigital account is ready
</h2>

<p style="margin: 0 0 14px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  Hi <strong>{{name}}</strong>,
</p>

<p style="margin: 0 0 20px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  Your studio account has been created. Use the credentials below to sign in:
</p>

<div style="background-color: #F9FAFB; border: 1px solid #E5E7EB; border-left: 4px solid #C89D66; padding: 16px 18px; border-radius: 10px; margin: 20px 0; color: #122E22; font-size: 14px; line-height: 1.6;">
  <p style="margin: 0 0 6px 0;"><strong>Email:</strong> {{email}}</p>
  <p style="margin: 0;"><strong>Temporary Password:</strong> {{password}}</p>
</div>

<p style="text-align: center; margin: 28px 0 8px 0;">
  <a href="{{loginUrl}}" style="background-color: #163324; color: #FFFFFF; padding: 13px 30px; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 15px; display: inline-block;">
    Login Now
  </a>
</p>

{{> footer}}
