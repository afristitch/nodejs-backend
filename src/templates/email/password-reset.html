{{> header}}

<h2 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 700; color: #122E22;">
  Reset your password
</h2>

<p style="margin: 0 0 14px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  Hi <strong>{{name}}</strong>,
</p>

<p style="margin: 0 0 24px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  We received a request to reset your password. Click the button below to choose a new one:
</p>

<p style="text-align: center; margin: 28px 0;">
  <a href="{{url}}" style="background-color: #163324; color: #FFFFFF; padding: 13px 30px; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 15px; display: inline-block;">
    Reset Password
  </a>
</p>

<div style="background-color: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 10px; padding: 14px 16px; margin-top: 24px;">
  <p style="margin: 0 0 6px 0; color: #6B7280; font-size: 12px; font-weight: 600;">
    Or copy and paste this link into your browser:
  </p>
  <p style="margin: 0; color: #163324; font-size: 12px; word-break: break-all; line-height: 1.5;">
    {{url}}
  </p>
</div>

{{> footer}}
