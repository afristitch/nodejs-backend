{{> header}}

<h2 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 700; color: #122E22;">
  Subscription expired
</h2>

<p style="margin: 0 0 14px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  Hi <strong>{{name}}</strong>,
</p>

<p style="margin: 0 0 20px 0; color: #374151; font-size: 15px; line-height: 1.6;">
  Your SewDigital subscription for <strong>{{orgName}}</strong> has expired today.
</p>

<div style="background-color: #FEF2F2; border-left: 4px solid #DC2626; padding: 16px 18px; border-radius: 10px; margin: 22px 0; color: #374151;">
  <p style="margin: 0; font-weight: 700; color: #B91C1C; font-size: 15px;">Your premium features are currently paused.</p>
  <p style="margin: 6px 0 0 0; font-size: 14px; line-height: 1.55;">Your client records and measurements are safe. Renew your plan now to regain instant access to all features.</p>
</div>

<p style="text-align: center; margin: 28px 0 8px 0;">
  <a href="{{renewUrl}}" style="background-color: #163324; color: #FFFFFF; padding: 13px 30px; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 15px; display: inline-block;">
    Renew Now
  </a>
</p>

{{> footer}}
