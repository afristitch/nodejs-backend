{{> header}}

<p style="font-family: 'Varela Round', sans-serif; color: #000; font-size: 16px;">
  Hi {{name}},
</p>

<p style="font-family: 'Varela Round', sans-serif; color: #000; font-size: 16px;">
  Your SewDigital subscription for <strong>{{orgName}}</strong> has expired today.
</p>

<div style="background-color: #FFEBEE; border-left: 4px solid #E53935; padding: 15px; border-radius: 4px; margin: 20px 0; font-family: 'Varela Round', sans-serif; color: #333;">
  <p style="margin: 0; font-weight: bold; color: #C62828;">Your premium features are currently paused.</p>
  <p style="margin: 5px 0 0 0; font-size: 14px;">Your client records and measurements are safe. Renew your plan now to regain instant access to all features.</p>
</div>

<p style="text-align: center; margin: 30px 0;">
  <a href="{{renewUrl}}" style="background-color: #000; color: #fff; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
    Renew Now
  </a>
</p>

{{> footer}}
